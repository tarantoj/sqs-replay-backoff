[package]
name = "sqs-replayer-lambda"
version = "0.1.0"
edition = "2021"
description = "Rust Lambda for the generic SQS replayer construct"
license = "Apache-2.0"

[dependencies]
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest"] }
aws-sdk-sqs = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-ssm = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-smithy-types = "1"
aws_lambda_events = { version = "1", default-features = false, features = ["sqs"] }
lambda_runtime = "1"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
futures = "0.3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "z"

[dev-dependencies]
aws-credential-types = "1"
wiremock = "0.6"